<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- viva room mark: a stopwatch, tying the identity to the live
       countdown, the single most characteristic moment in this
       product, rather than the previous terminal-chevron mark. Bright
       amber badge with a dark mark on top, not a dark badge with a
       bright mark, for visibility at real favicon size (16px in most
       browser tabs): confirmed by rendering both this file and the
       earlier design at 16px before choosing this treatment. Every
       comment in this file was written and checked to contain no
       double hyphen anywhere in its body, since that alone is enough
       to make an XML file invalid even though a browser would still
       download it over HTTP with no visible error at all. -->
  <rect width="32" height="32" rx="7" fill="#e8a33e" />
  <line x1="16" y1="5" x2="16" y2="8" stroke="#1b1e27" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="16" cy="18" r="9" fill="none" stroke="#1b1e27" stroke-width="2.4" />
  <line x1="16" y1="18" x2="16" y2="12.5" stroke="#1b1e27" stroke-width="2.2" stroke-linecap="round" />
  <line x1="16" y1="18" x2="20" y2="18" stroke="#1b1e27" stroke-width="2.2" stroke-linecap="round" />
</svg>
