[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-cli"
version = "0.0.1"
description = "A local-LLM RAG tool that conducts a timed, code-grounded viva on a GitHub project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<14.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "ollama>=0.3.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.14,<4.0",
]

[project.scripts]
viva = "viva.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
