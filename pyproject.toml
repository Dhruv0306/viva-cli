[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-cli"
version = "0.3.0"
description = "A local-LLM RAG tool that conducts a timed, code-grounded viva on a GitHub project."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.7,<16.0",
    "pydantic>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "ollama>=0.3.0,<1.0",
    "GitPython>=3.1,<4.0",
    "tree-sitter>=0.23,<1.0",
    "tree-sitter-language-pack>=0.7,<2.0",
    "chromadb>=0.5,<2.0",
    "prompt_toolkit>=3.0,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "pytest-mock>=3.14,<4.0",
    "httpx2>=2.0,<3.0",
    "ruff>=0.16,<1.0",
    "mypy>=2.0,<3.0",
    "pytest-cov>=6.0,<8.0",
]
# Phase 11 (docs/system-design/16-phase-11-voice-io-design.md): kept as an
# optional extra rather than a base dependency -- these pull in native
# audio libraries (PortAudio via sounddevice) and multi-hundred-MB models,
# which most people running `viva start` without voice mode never need.
# `viva.voice_io` imports all three lazily so the base install and test
# suite never require this extra.
voice = [
    "faster-whisper>=1.0,<2.0",
    # >=1.3 is the OHF-Voice piper1-gpl rewrite this code targets --
    # earlier versions used a different download API (design doc §16.9).
    "piper-tts>=1.3,<2.0",
    "sounddevice>=0.4,<1.0",
    "numpy>=1.26,<3.0",
]

[project.scripts]
viva = "viva.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Real bug found while setting up the release workflow: without this,
# `python -m build`'s wheel silently drops src/viva/web/static/* (index.html,
# style.css, app.js, voice-worklet.js, favicon.svg) entirely -- setuptools
# only bundles importable .py files by default. `pip install -e .` (every
# dev/CI install so far) reads straight from the source tree regardless,
# so this was invisible until a real installed wheel was actually tested:
# `viva serve` would 404 every static asset for anyone installing this
# package for real, e.g. from a GitHub release or PyPI. Verified fixed by
# building a wheel and confirming static/ is present after a clean install.
"viva.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The golden-repo fixtures under tests/fixtures/golden_repos/ contain
# their own test_*.py files (they're small real-looking projects used as
# ingest test data) -- these must not be collected as viva-cli's own
# tests, since they import from an "app" package that doesn't exist in
# this project's environment.
norecursedirs = ["tests/fixtures/golden_repos"]

[tool.ruff]
line-length = 88
# tests/fixtures/golden_repos/ holds small synthetic repos used as ingest
# test data -- deliberately not "clean" code (an unused import, e.g., may
# be there on purpose to exercise the analyzer/indexer against it), not
# this project's own source. Same reasoning as
# [tool.pytest.ini_options].norecursedirs above, applied here too.
exclude = ["tests/fixtures/golden_repos"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# E501 (line-too-long) is deliberately excluded, not an oversight: 720
# lines in this codebase already exceed the default 88-column limit as of
# Phase 19. Enforcing it now means either a large mechanical reformat
# riding along with "add CI gates," or picking an arbitrary wider limit
# that doesn't actually decide anything. Line-length enforcement belongs
# with a future, separately-scoped `ruff format`/`black` adoption. See
# docs/system-design/24-phase-19-ci-quality-gates-design.md §24.1.2.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's own idiomatic API is typer.Option(...)/typer.Argument(...) as
# parameter defaults -- B008 ("function call in default argument") can't
# tell this apart from an accidental mutable-default-style bug. FastAPI's
# Depends() pattern would trigger the same false positive if web/app.py
# ever adopts it (it doesn't today, checked directly). See §24.1.3.
"src/viva/cli.py" = ["B008"]

[tool.mypy]
strict = true
# Every module not listed below is held to full strict mode starting
# Phase 19 -- any new file, or any of the 30 files that already pass
# clean, fails CI on a strict violation immediately. The overrides below
# are pre-existing debt as measured when this phase landed, each scoped
# to that file's actual error codes (not a blanket ignore_errors, which
# would also hide a new, unrelated error in that same file later).
# Tracked as a docs/plan.md backlog item to work through file by file.
# See docs/system-design/24-phase-19-ci-quality-gates-design.md §24.2.3.

[[tool.mypy.overrides]]
# Optional, lazily-imported native deps (Phase 11 design) -- never
# installed in CI's default `dev` extra, so these have no type stubs
# available there by design, not by omission.
module = ["faster_whisper", "piper", "sounddevice"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "viva.analyzer"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "viva.analyzer.extract"
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
module = "viva.cleanup"
disable_error_code = ["operator"]

[[tool.mypy.overrides]]
module = "viva.cli"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "viva.evaluator"
disable_error_code = ["type-arg", "union-attr", "arg-type"]

[[tool.mypy.overrides]]
module = "viva.indexer.store"
disable_error_code = ["index", "arg-type", "type-arg"]

[[tool.mypy.overrides]]
module = "viva.ingest.clone"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "viva.llm_client"
disable_error_code = ["no-any-return", "type-arg"]

[[tool.mypy.overrides]]
module = "viva.orchestrator"
disable_error_code = ["misc", "arg-type"]

[[tool.mypy.overrides]]
module = "viva.phase0_demo"
disable_error_code = ["arg-type"]

[[tool.mypy.overrides]]
module = "viva.profile"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "viva.questiongen.retrieval"
disable_error_code = ["type-arg"]

[[tool.mypy.overrides]]
module = "viva.session_ui"
disable_error_code = ["union-attr", "no-untyped-def", "type-arg"]

[[tool.mypy.overrides]]
module = "viva.storage.session_store"
disable_error_code = ["no-untyped-def", "type-arg"]

[[tool.mypy.overrides]]
module = "viva.voice_io"
disable_error_code = ["type-arg", "no-untyped-call", "no-untyped-def"]

[[tool.mypy.overrides]]
module = "viva.web.app"
disable_error_code = ["no-untyped-def", "type-arg"]

[[tool.mypy.overrides]]
module = "viva.web.web_session_ui"
disable_error_code = ["type-arg", "arg-type"]
